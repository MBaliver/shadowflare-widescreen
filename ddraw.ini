; cnc-ddraw config for ShadowFlare Widescreen Patch (default internal res: 1280x540)
; Copy this file together with ddraw.dll from https://github.com/FunkyFr3sh/cnc-ddraw
; into your ShadowFlare installation directory.
;
; On Linux / Steam Proton, add to Steam Launch Options:
;   WINEDLLOVERRIDES="ddraw=n,b" %command%

[ddraw]
fullscreen=true
windowed=true
border=false
maintas=true
boxing=true
shader=Nearest neighbor
renderer=auto
d3d9_filter=0
adjmouse=true
nonexclusive=true
resolutions=2
savesettings=0
; Disables ClipCursor lock — prevents input freeze on click under Linux XWayland fullscreen
devmode=true
singlecpu=true
screenshotdir=.\Screenshots\

[ShadowFlare]
nonexclusive=true
adjmouse=true
